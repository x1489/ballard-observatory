name: CI
on:
  push:
  pull_request:
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - name: Edge build (Cloudflare Worker sources)
        run: node edge/build.mjs
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip, cache-dependency-path: platform/requirements.txt }
      - run: pip install -r platform/requirements.txt pytest
      - run: python -m pytest -q tests
        working-directory: platform
